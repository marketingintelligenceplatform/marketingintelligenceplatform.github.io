databases:
  - name: marketing-intelligence-platform-db
    plan: free
    databaseName: mip
    user: mip

services:
  - type: web
    name: marketing-intelligence-platform-mip
    runtime: node
    plan: free

    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: marketing-intelligence-platform-db
          property: connectionString

      - key: DB_SSL
        # The Blueprint injects Render's private-network database URL.
        value: "false"

      - key: SESSION_SECRET
        generateValue: true

      - key: GEMINI_API_KEY
        sync: false

      - key: APP_URL
        value: https://marketing-intelligence-platform-mip.onrender.com

      - key: CORS_ORIGIN
        value: https://marketingintelligenceplatform.github.io
